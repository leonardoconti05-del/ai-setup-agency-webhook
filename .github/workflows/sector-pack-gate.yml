name: sector-pack-gate

on:
  pull_request:
    paths:
      - 'lib/engine/packs/**'
      - 'lib/engine/pack.js'
      - 'lib/engine/evaluate.js'
      - 'scripts/valuta-tutti-pack.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  sector-packs:
    strategy:
      fail-fast: false
      matrix:
        sector: [autofficina, bar_caffetteria, dentista, elettricista, estetista, fisioterapista, immobiliare, parrucchiere, ristorante, veterinario]
    runs-on: ubuntu-latest
    name: ${{ matrix.sector }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node scripts/valuta-tutti-pack.mjs ${{ matrix.sector }}
